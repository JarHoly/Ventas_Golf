<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- El navbar de la app es blanco: si esto queda en negro (el valor por
         defecto de Create React App), en navegadores móviles con tema oscuro
         se ve una franja negra encima del navbar blanco, como un "cosido" feo. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Control de ventas" />
    <!-- PWA: instalable como app (ver InstalarApp.js para el tutorial in-app). -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E Cuestas" />
    <!-- Fuente Inter (del design system). Si no hay internet, cae a la fuente del sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>E Cuestas</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
